name: Release

# Builds a debug APK (debug-signed, therefore installable) and attaches it to a
# GitHub Release. Triggers when a v* tag is pushed, e.g. `git tag v1.0.0 && git push origin v1.0.0`.
# The release variant is R8-optimized but unsigned — switch the task to
# :app:assembleRelease once a signing key/secret is configured.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk \
             Justagem-${GITHUB_REF_NAME#v}.apk

      - name: Create GitHub release and attach APK
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            Justagem-*.apk
