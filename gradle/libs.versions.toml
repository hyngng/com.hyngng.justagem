[versions]
agp = "9.4.1"
# Must match the kotlin-gradle-plugin classpath override in the root build.gradle.kts.
kotlin = "2.4.21"
coreKtx = "1.19.1"
lifecycle = "2.11.0"
activity = "1.13.0"
composeBom = "2026.02.01"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"

# ML Kit GenAI. genai-prompt beta5 is built with Kotlin 2.4.x, so the Kotlin
# compiler override in the root build script is required.
genaiPrompt = "1.0.0-beta5"
genaiSchema = "1.0.0-alpha2"
genaiSpeech = "1.0.0-alpha1"
genaiTts = "1.0.0-alpha1"
genaiEmbedding = "1.0.0-alpha1"
markwon = "4.6.2"
ratex = "0.1.15"
jsoup = "1.23.2"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activity" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
mlkit-genai-prompt = { group = "com.google.mlkit", name = "genai-prompt", version.ref = "genaiPrompt" }
mlkit-genai-schema = { group = "com.google.mlkit", name = "genai-schema", version.ref = "genaiSchema" }
mlkit-genai-speech = { group = "com.google.mlkit", name = "genai-speech-recognition", version.ref = "genaiSpeech" }
mlkit-genai-tts = { group = "com.google.mlkit", name = "genai-text-to-speech", version.ref = "genaiTts" }
mlkit-genai-embedding = { group = "com.google.mlkit", name = "genai-embedding", version.ref = "genaiEmbedding" }
markwon-core = { group = "io.noties.markwon", name = "core", version.ref = "markwon" }
markwon-tables = { group = "io.noties.markwon", name = "ext-tables", version.ref = "markwon" }
markwon-tasklist = { group = "io.noties.markwon", name = "ext-tasklist", version.ref = "markwon" }
markwon-strikethrough = { group = "io.noties.markwon", name = "ext-strikethrough", version.ref = "markwon" }
markwon-inline-parser = { group = "io.noties.markwon", name = "inline-parser", version.ref = "markwon" }
ratex-android = { group = "io.github.erweixin", name = "ratex-android", version.ref = "ratex" }
jsoup = { group = "org.jsoup", name = "jsoup", version.ref = "jsoup" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
